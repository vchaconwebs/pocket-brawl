<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1220">
<title>PokéVersus · Buzón</title>
<link rel="icon" href="assets/icons/icon-192.png">
<style>
  @font-face { font-family: 'Jersey10'; src: url('assets/fonts/Jersey10.ttf'); }
  :root { color-scheme: dark; --bg: #0e1220; --panel: #182036; --panel-2: #1f2943; --edge: #33416a; --text: #f1f4fb; --text-2: #b9c3dc; --muted: #7d89a8; --gold: #ffcf2e; --bug: #ff7a7a; --idea: #39d38a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 48px; }
  h1 { font-family: 'Jersey10', sans-serif; font-weight: normal; font-size: 42px; line-height: 1; margin: 0; color: var(--gold); }
  .sub { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .seg button { border: 1px solid var(--edge); background: var(--panel); color: var(--text-2); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { border-color: var(--gold); color: var(--text); background: var(--panel-2); font-weight: 600; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .msg { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .msg .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .tag { font-weight: 700; font-size: 11px; border-radius: 6px; padding: 1px 7px; color: #10131c; }
  .tag.bug { background: var(--bug); } .tag.idea { background: var(--idea); } .tag.report { background: #ff7a7a; }
  .msg .who { color: var(--text-2); font-weight: 600; }
  .msg p { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .msg .del { margin-left: auto; background: none; border: 1px solid var(--edge); color: var(--muted); border-radius: 8px; padding: 2px 9px; cursor: pointer; font: inherit; font-size: 12px; }
  .msg .del:hover { color: var(--bug); border-color: var(--bug); }
  .empty, .lock { text-align: center; color: var(--muted); padding: 40px 10px; }
  .lock a { color: var(--gold); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Buzón de ideas y bugs</h1>
  <p class="sub" id="sub">Comprobando tu cuenta…</p>
  <div class="bar hidden" id="bar">
    <div class="seg" id="filter"><button data-f="all" class="on">Todo</button> <button data-f="bug">🐞 Fallos</button> <button data-f="idea">💡 Ideas</button> <button data-f="report">🚩 Reportes</button></div>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
  // Solo pueden leer los mensajes estas cuentas del juego (lo aseguran las reglas de Firebase):
  // Fl3xix (el creador) y JuanmitaDinamita (ayuda con el juego)
  const ADMINS = ['ULFnTGBapaaIUhxmHKgCh9TIm6G3', 'JEs9NfqgO6OYw7UKCyDSsqRnk0S2'];
  firebase.initializeApp({
    apiKey: 'AIzaSyA6C_hWt0VOhk1pzsN8NuYeqx_IhP2cRf0',
    authDomain: 'pokeversus-9ed3a.firebaseapp.com',
    databaseURL: 'https://pokeversus-9ed3a-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'pokeversus-9ed3a',
    appId: '1:329495817613:web:b9e8dcb3387b0dbb0421c4',
  });
  const $ = (s) => document.querySelector(s);
  let items = [], filter = 'all';
  const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function render() {
    const list = items.filter((m) => filter === 'all' || (filter === 'report' ? m.report : m.kind === filter && !m.report));
    $('#count').textContent = `${list.length} mensaje${list.length === 1 ? '' : 's'}`;
    if (!list.length) { $('#list').innerHTML = '<div class="empty">No hay mensajes por aquí todavía.</div>'; return; }
    $('#list').innerHTML = list.map((m) => {
      const d = new Date(m.t || 0);
      const when = d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      return `<div class="msg"><div class="top"><span class="tag ${m.report ? 'report' : m.kind}">${m.report ? 'REPORTE' : m.kind === 'idea' ? 'IDEA' : 'FALLO'}</span>` +
        (m.report ? `<span class="who">→ ${esc(m.report.name)} <small>(${esc(m.report.uid)})</small></span>` : '') +
        `<span class="who">${m.report ? 'de ' : ''}${esc(m.name) || 'Sin nombre'}</span><span>${when}</span><span>v${esc(m.v)}</span><span>${m.mobile ? 'móvil' : 'PC'}</span><span>${esc(m.lang)}</span>` +
        (OWNER_ME && (m.report || m.uid) ? `<button class="del sanc" data-u="${esc(m.report ? m.report.uid : m.uid)}" data-n="${esc(m.report ? m.report.name : m.name)}">⛔ Sancionar${m.report ? ' al reportado' : ''}</button>` : '') +
        `<button class="del" data-id="${esc(m.id)}">Borrar</button></div><p>${esc(m.text)}</p></div>`;
    }).join('');
    document.querySelectorAll('.del:not(.sanc)').forEach((b) => (b.onclick = () => {
      if (confirm('¿Borrar este mensaje?')) firebase.database().ref('feedback/' + b.dataset.id).remove();
    }));
    // sancionar por un tiempo: sin chat, sin jugar online o las dos cosas (se quita sola al acabar)
    document.querySelectorAll('.sanc').forEach((b) => (b.onclick = async () => {
      const what = prompt('Sancionar a ' + b.dataset.n + '\n¿Qué? 1 = sin chat y sin jugar · 2 = solo chat · 3 = solo sin jugar (ni con bots)', '1');
      if (!what || !['1', '2', '3'].includes(what.trim())) return;
      const time = prompt('¿Cuánto tiempo? Escribe horas (ej. 1, 24, 168), 0 = quitar la sanción, -1 = para siempre', '24');
      if (time === null || isNaN(+time)) return;
      const h = +time, v = h < 0 ? true : h > 0 ? Date.now() + h * 3600000 : null;
      const keys = what.trim() === '1' ? ['chatBan', 'playBan'] : what.trim() === '2' ? ['chatBan'] : ['playBan'];
      try {
        await Promise.all(keys.map((k) => (v === null ? firebase.database().ref(k + '/' + b.dataset.u).remove() : firebase.database().ref(k + '/' + b.dataset.u).set(v))));
        alert(v === null ? 'Sanción quitada' : 'Sanción puesta');
      } catch (e) { alert('No se ha podido: ' + e.message); }
    }));
  }
  document.querySelectorAll('#filter button').forEach((b) => (b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('#filter button').forEach((x) => x.classList.toggle('on', x === b));
    render();
  }));
  let OWNER_ME = false;
  firebase.auth().onAuthStateChanged((u) => {
    OWNER_ME = !!(u && u.uid === 'ULFnTGBapaaIUhxmHKgCh9TIm6G3');
    if (!u || !ADMINS.includes(u.uid)) {
      $('#sub').textContent = '';
      $('#list').innerHTML = '<div class="lock">🔒 Este buzón solo lo pueden ver los administradores.<br>Entra primero en <a href="/">pokeversus.com</a> con tu cuenta y vuelve a abrir esta página.</div>';
      return;
    }
    $('#sub').textContent = 'Lo que te mandan los jugadores desde el botón «Ideas y bugs». Se actualiza solo.';
    $('#bar').classList.remove('hidden');
    firebase.database().ref('feedback').on('value', (s) => {
      const v = s.val() || {};
      items = Object.entries(v).map(([id, m]) => Object.assign({ id }, m)).sort((a, b) => (b.t || 0) - (a.t || 0));
      render();
    });
  });
</script>
</body>
</html>
